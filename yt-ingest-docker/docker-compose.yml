# Source/ZIP deployment. Use scripts/install-local.sh for first installation.
name: yt-ingest
services:
  yt-ingest:
    image: yt-ingest:local
    build:
      context: .
    container_name: yt-ingest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-UTC}
      SCHEDULE_TIME: ${SCHEDULE_TIME:-03:00}
      RUN_ON_START: ${RUN_ON_START:-auto}
      MIN_FREE_GB: ${MIN_FREE_GB:-5}
      STORAGE_POLICY: ${STORAGE_POLICY:-pause}
      HOST_DATA_DIR: ${PWD}/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid,nodev
      - /run/yt-ingest:size=1m,uid=1000,gid=1000,mode=0775,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
