<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}yt-ingest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('overview') }}">yt-ingest</a>
    <nav aria-label="Main">
      <a href="{{ url_for('overview') }}" {% if page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="{{ url_for('live_page') }}" {% if page == 'live' %}aria-current="page"{% endif %}>Live log</a>
      <a href="{{ url_for('channels_page') }}" {% if page == 'channels' %}aria-current="page"{% endif %}>Channel lists</a>
      <a href="{{ url_for('videos_page') }}" {% if page == 'videos' %}aria-current="page"{% endif %}>Videos</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
